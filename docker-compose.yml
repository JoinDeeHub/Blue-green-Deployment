version: "3"

services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/bluegreen

  frontend-blue:
    build: ./frontend-blue
    container_name: frontend-blue
    ports:
      - "3002:3100" 
    depends_on:
      - backend

  frontend-green:
    build: ./frontend-green
    container_name: frontend-green
    ports:
      - "3001:3200"
    depends_on:
      - backend